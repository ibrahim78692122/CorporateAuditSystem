<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transaction Statistics</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 20px 40px;
        }

        .container {
            padding: 40px;
        }

        h2 {
            color: #1f4e79;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .card h3 {
            color: #555;
            margin-top: 0;
        }

        .value {
            font-size: 28px;
            font-weight: bold;
            color: #1f4e79;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 20px;
            background: #1f4e79;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Corporate Audit System</h1>
    <p>Transaction Statistics</p>
</div>

<div class="container">

    <h2>Transaction Statistics</h2>

    <div class="cards">

        <div class="card">
            <h3>Total Transactions</h3>
            <div class="value" th:text="${total}">
                0
            </div>
        </div>

        <div class="card">
            <h3>Total Amount</h3>
            <div class="value">
                ₹<span th:text="${totalAmount}">0</span>
            </div>
        </div>

        <div class="card">
            <h3>Highest Transaction</h3>
            <div class="value">
                ₹<span th:text="${highest}">0</span>
            </div>
        </div>

        <div class="card">
            <h3>Average Transaction</h3>
            <div class="value">
                ₹<span th:text="${average}">0</span>
            </div>
        </div>

    </div>

    <a class="back" href="/accountant/create-entry">
        ← Create New Entry
    </a>

    <a class="back" href="/accountant/entries">
        View Entries
    </a>

    <a class="back" href="/accountant/dashboard">
    ← Back to Dashboard
</a>

</div>

</body>

</html>
