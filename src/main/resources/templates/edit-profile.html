<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - Corporate Audit System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #e0f2fe,
                    #f0fdfa
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;
        }

        .profile-container {

            width: 450px;

            background: white;

            padding: 35px;

            border-radius: 24px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.12);
        }

        .header {

            text-align: center;

            margin-bottom: 28px;
        }

        .icon {

            width: 70px;
            height: 70px;

            margin: 0 auto 15px;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #0f766e
                );

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 35px;

            color: white;
        }

        h1 {

            color: #0f172a;

            font-size: 25px;

            margin-bottom: 7px;
        }

        .subtitle {

            color: #64748b;

            font-size: 14px;
        }

        .message {

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 14px;

            text-align: center;
        }

        .error {

            background: #fee2e2;

            color: #b91c1c;
        }

        .form-group {

            margin-bottom: 20px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #334155;

            font-size: 14px;
        }

        input {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 11px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }

        .hint {

            font-size: 12px;

            color: #64748b;

            margin-top: 6px;
        }

        .save-button {

            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #0f766e
                );

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }

        .save-button:hover {

            opacity: 0.92;
        }

        .back-button {

            display: block;

            text-align: center;

            text-decoration: none;

            color: #475569;

            background: #f1f5f9;

            padding: 13px;

            border-radius: 12px;

            margin-top: 12px;

            font-size: 14px;

            font-weight: bold;
        }

        .back-button:hover {

            background: #e2e8f0;
        }

        .role-box {

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            padding: 12px;

            border-radius: 11px;

            margin-bottom: 20px;

            color: #475569;

            font-size: 14px;
        }

        .role-box strong {

            color: #2563eb;
        }

                .image-section {

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 20px;

            text-align: center;
        }

        .current-image img,
        .default-avatar {

            width: 110px;

            height: 110px;

            border-radius: 50%;

            object-fit: cover;

            margin: 0 auto 15px;
        }

        .default-avatar {

            display: flex;

            justify-content: center;

            align-items: center;

            background: #dbeafe;

            font-size: 55px;
        }

        .image-section input {

            margin-top: 10px;

            padding: 10px;

            font-size: 14px;
        }

        .upload-button {

            width: 100%;

            border: none;

            padding: 12px;

            border-radius: 10px;

            background: #0f766e;

            color: white;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 10px;
        }

        .upload-button:hover {

            opacity: 0.9;
        }

    </style>

</head>

<body>

<div class="profile-container">

    <div class="header">

        <div class="icon">
            👤
        </div>

        <h1>
            My Profile
        </h1>

        <p class="subtitle">
            Update your account information
        </p>

    </div>


    <!-- ERROR MESSAGE -->

    <div th:if="${error}"
         class="message error"
         th:text="${error}">

        Error message

    </div>


    <!-- ROLE -->

    <div class="role-box">

        Account Role:

        <strong th:text="${user.role}">
            ACCOUNTANT
        </strong>

    </div>

        <!-- PROFILE PICTURE -->

    <div class="image-section">

        <label>
            Profile Picture
        </label>

        <div class="current-image">

            <img
                th:if="${user.profileImage != null and !#strings.isEmpty(user.profileImage)}"
                th:src="${user.profileImage}"
                alt="Profile Picture">

            <div
                th:unless="${user.profileImage != null and !#strings.isEmpty(user.profileImage)}"
                class="default-avatar">

                👤

            </div>

        </div>

        <form
            action="/profile/upload-image"
            method="post"
            enctype="multipart/form-data">

            <input
                type="file"
                name="profileImage"
                accept="image/png,image/jpeg,image/webp"
                required>

            <button
                type="submit"
                class="upload-button">

                📷 Upload / Change Picture

            </button>

        </form>

    </div>


    <!-- FORM -->

    <form action="/profile/update"
          method="post">


        <!-- USERNAME -->

        <div class="form-group">

            <label for="newUsername">
                Username
            </label>

            <input
                type="text"
                id="newUsername"
                name="newUsername"
                th:value="${user.username}"
                placeholder="Enter username"
                required>

        </div>


        <!-- NEW PASSWORD -->

        <div class="form-group">

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                name="newPassword"
                placeholder="Enter new password">

            <p class="hint">
                Password blank chhodoge to current password
                same rahega.
            </p>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm new password">

        </div>


        <!-- SAVE -->

        <button
            type="submit"
            class="save-button">

            💾 Save Changes

        </button>


    </form>


    <!-- BACK -->

    <a href="/profile"
       class="back-button">

        ← Back to Profile

    </a>

</div>

</body>

</html>
