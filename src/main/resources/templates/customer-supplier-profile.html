<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer / Supplier Profile</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 25px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            margin: 7px 0 0;
        }

        .container {
            width: 92%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .top h2 {
            margin: 0;
            color: #1f4e79;
        }

        .back-btn {
            background: #1f4e79;
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 7px;
            font-weight: bold;
        }

        .profile-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #1f4e79;
        }

        .default-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            border: 4px solid #1f4e79;
        }

        .profile-info h1 {
            margin: 0 0 10px;
            color: #1f4e79;
        }

        .profile-info p {
            margin: 8px 0;
            color: #555;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .title {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .value {
            font-size: 24px;
            font-weight: bold;
            color: #1f4e79;
        }

        .outstanding {
            color: #dc3545;
        }

        .overdue {
            color: #dc3545;
        }

        @media (max-width: 900px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .header {
                padding: 20px;
            }

            .container {
                width: 94%;
            }

            .top {
                flex-direction: column;
                align-items: flex-start;
            }

            .profile-card {
                flex-direction: column;
                text-align: center;
            }

            .cards {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="header">

    <h1>Corporate Audit System</h1>

    <p>Customer / Supplier Profile</p>

</div>


<div class="container">


    <div class="top">

        <h2>👤 Profile Details</h2>

        <a href="/accountant/customer-suppliers"
           class="back-btn">

            ← Back

        </a>

    </div>


    <!-- PROFILE -->

    <div class="profile-card">


        <img
            th:if="${customer.profileImage != null
                    and !customer.profileImage.isBlank()}"
            th:src="${customer.profileImage}"
            class="profile-image"
            alt="Profile">


        <div
            th:if="${customer.profileImage == null
                    or customer.profileImage.isBlank()}"
            class="default-image">

            👤

        </div>


        <div class="profile-info">

            <h1 th:text="${customer.name}">
                Customer Name
            </h1>

            <p>
                📞
                <strong>Phone:</strong>
                <span th:text="${customer.phone}">
                    Not Available
                </span>
            </p>

            <p>
                📍
                <strong>Address:</strong>
                <span th:text="${customer.address}">
                    Not Available
                </span>
            </p>

        </div>

    </div>


    <!-- STATISTICS -->

    <div class="cards">


        <div class="card">

            <div class="icon">
                📊
            </div>

            <div class="title">
                Total Transactions
            </div>

            <div class="value"
                 th:text="${customer.totalTransactions}">
                0
            </div>

        </div>


        <div class="card">

            <div class="icon">
                💵
            </div>

            <div class="title">
                Total Paid
            </div>

            <div class="value">

                ₹<span
                    th:text="${#numbers.formatDecimal(
                        customer.totalPaid, 1, 2
                    )}">
                    0.00
                </span>

            </div>

        </div>


        <div class="card">

            <div class="icon">
                💰
            </div>

            <div class="title">
                Total Outstanding
            </div>

            <div class="value outstanding">

                ₹<span
                    th:text="${#numbers.formatDecimal(
                        customer.totalOutstanding, 1, 2
                    )}">
                    0.00
                </span>

            </div>

        </div>


        <div class="card">

            <div class="icon">
                🚨
            </div>

            <div class="title">
                Overdue Amount
            </div>

            <div class="value overdue">

                ₹<span
                    th:text="${#numbers.formatDecimal(
                        customer.overdueAmount, 1, 2
                    )}">
                    0.00
                </span>

            </div>

        </div>


    </div>


</div>


</body>

</html>
