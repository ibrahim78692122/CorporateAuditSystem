<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Corporate Audit System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f2f4f7;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .login-box {
            width: 380px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 25px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;

            color: #1f4e79;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-top: 15px;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 14px;
        }

        input:focus {
            outline: none;

            border-color: #1f4e79;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #1f4e79;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #163a5c;
        }

        .error-message {
            background: #fee2e2;

            color: #b91c1c;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 15px;

            text-align: center;
        }

        .success-message {
            background: #dcfce7;

            color: #166534;

            padding: 10px;

            border-radius: 6px;

            margin-bottom: 15px;

            text-align: center;
        }

        .register-link {
            text-align: center;

            margin-top: 20px;

            color: #777;
        }

        .register-link a {
            color: #0f766e;

            font-weight: bold;

            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <h1>Corporate Audit System</h1>

        <div class="subtitle">
            Secure Login
        </div>


        <!-- SUCCESS MESSAGE -->

        <div
            class="success-message"
            th:if="${success}"
            th:text="${success}">
        </div>


        <!-- ERROR MESSAGE -->

        <div
            class="error-message"
            th:if="${error}"
            th:text="${error}">
        </div>


        <!-- LOGIN FORM -->

        <form action="/login" method="post">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <!-- REGISTER LINK -->

        <div class="register-link">

            <span>
                Don't have an account?
            </span>

            <a href="/register">
                Create Account
            </a>

        </div>

    </div>

</body>

</html>
