<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Blockchain</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 25px 40px;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .valid {
            background: #d1e7dd;
            color: #0f5132;
        }

        .invalid {
            background: #f8d7da;
            color: #842029;
        }

        .block {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .block h3 {
            color: #1f4e79;
            margin-top: 0;
        }

        .buttons {
            margin-top: 25px;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            margin-right: 10px;
            border-radius: 6px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        .dashboard {
            background: #1f4e79;
        }

        .verify {
            background: #198754;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Corporate Audit System</h1>
    <p>Blockchain Verification</p>
</div>

<div class="container">

    <h2>🔗 Blockchain</h2>

    <div th:class="${blockchainValid} ? 'status valid' : 'status invalid'"
         th:text="${blockchainValid}
                  ? '✅ Blockchain is Valid'
                  : '❌ Blockchain is Invalid'">
        Blockchain Status
    </div>

    <div th:each="block : ${blocks}"
         class="block">

        <h3>
            Block #
            <span th:text="${block.index}">0</span>
        </h3>

        <p>
            <strong>Previous Hash:</strong>
            <span th:text="${block.previousHash}">
                Previous Hash
            </span>
        </p>

        <p>
            <strong>Hash:</strong>
            <span th:text="${block.hash}">
                Hash
            </span>
        </p>

        <p>
            <strong>Timestamp:</strong>
            <span th:text="${block.timestamp}">
                Timestamp
            </span>
        </p>

        <p>
            <strong>Data:</strong>
            <span th:text="${block.data}">
                Data
            </span>
        </p>

    </div>

    <div class="buttons">

        <a href="/accountant/dashboard"
           class="btn dashboard">
            ← Dashboard
        </a>

        <a href="/accountant/blockchain"
           class="btn verify">
            🔍 Verify Blockchain
        </a>

    </div>

</div>

</body>
</html>
