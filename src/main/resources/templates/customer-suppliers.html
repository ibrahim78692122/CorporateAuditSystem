<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customers & Suppliers</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .header {
            background: #1f4e79;
            color: white;
            padding: 25px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .header p {
            margin: 7px 0 0;
        }

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
        }

        .top h2 {
            margin: 0;
            color: #1f4e79;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 7px;
            font-weight: bold;
            color: white;
        }

        .add-btn {
            background: #198754;
        }

        .back-btn {
            background: #1f4e79;
        }

        .table-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #1f4e79;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .profile {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ddd;
        }

        .no-image {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .name {
            font-weight: bold;
            color: #1f4e79;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        @media (max-width: 600px) {

            .header {
                padding: 20px;
            }

            .container {
                width: 94%;
            }

            .top {
                flex-direction: column;
                align-items: flex-start;
            }

            .buttons {
                flex-wrap: wrap;
            }

        }

    </style>

</head>


<body>


<div class="header">

    <h1>Corporate Audit System</h1>

    <p>Customer / Supplier Management</p>

</div>


<div class="container">


    <div class="top">

        <h2>👥 Customers & Suppliers</h2>

        <div class="buttons">

            <a href="/accountant/customer-supplier"
               class="btn add-btn">
                ➕ Add New
            </a>

            <a href="/accountant/dashboard"
               class="btn back-btn">
                ← Dashboard
            </a>

        </div>

    </div>


    <div class="table-card">


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>Profile</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Action</th>

                    </tr>

                </thead>


                <tbody>


                    <tr th:each="customer : ${customers}">


                        <td>

                            <img
                                th:if="${customer.profileImage != null
                                        and !customer.profileImage.isBlank()}"
                                th:src="${customer.profileImage}"
                                class="profile"
                                alt="Profile">

                            <div
                                th:if="${customer.profileImage == null
                                        or customer.profileImage.isBlank()}"
                                class="no-image">

                                👤

                            </div>

                        </td>


                        <td>

                            <span
                                class="name"
                                th:text="${customer.name}">
                                Customer Name
                            </span>

                        </td>


                        <td
                            th:text="${customer.phone}">
                            0000000000
                        </td>


                        <td
                            th:text="${customer.address}">
                            Address
                        </td>


                        <td>

                           <a
    th:href="@{/accountant/customer-supplier/{id}(id=${customer.id})}"
    style="
        background:#1f4e79;
        color:white;
        padding:7px 12px;
        border-radius:6px;
        text-decoration:none;
        font-weight:bold;
    ">

    👁️ View

</a>

                        </td>


                    </tr>


                    <tr th:if="${#lists.isEmpty(customers)}">

                        <td colspan="5"
                            class="empty">

                            👥 No Customers/Suppliers Found

                            <br><br>

                            <a
                                href="/accountant/customer-supplier"
                                style="
                                    background:#198754;
                                    color:white;
                                    padding:10px 16px;
                                    border-radius:7px;
                                    text-decoration:none;
                                    font-weight:bold;
                                ">

                                ➕ Add Customer/Supplier

                            </a>

                        </td>

                    </tr>


                </tbody>

            </table>

        </div>

    </div>

</div>


</body>

</html>
